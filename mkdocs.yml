site_name: Android y apps móviles · Apuntes
site_description: "Apuntes de Android y apps móviles con Kotlin y Compose: interfaces, botones, imágenes, formularios, listas, navegación, temas y datos."
site_url: https://apuntes-dam.github.io/android-apuntes/
repo_url: https://github.com/apuntes-dam/android-apuntes
repo_name: GitHub
theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo oscuro
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
extra_css:
  - assets/narrador.css
  - assets/extra.css
  - assets/lenguajes.css?v=2264daec
extra_javascript:
  - assets/narrador.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/apuntes-dam/
      name: Síguenos en GitHub
copyright: Practica los Lenguajes de Programación para 1º DAM y 2º DAM · <a href="https://github.com/apuntes-dam/">Síguenos en GitHub</a>
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
