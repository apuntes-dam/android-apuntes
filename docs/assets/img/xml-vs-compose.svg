<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="XML describe la interfaz en un documento aparte y la lógica va en otro archivo de Kotlin; en Compose la interfaz y la lógica están juntas, en una sola función de Kotlin. Equivalencias: etiqueta = composable, atributo = parámetro, valor = argumento, anidamiento = slots">
<defs><marker id="p2f6fdc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdc"/></marker><marker id="pe08a1e" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<rect x="1" y="1" width="998" height="508" rx="14" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/>
<text x="500" y="40" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">XML: dos documentos y dos lenguajes. Compose: uno solo.</text>
<rect x="40.0" y="80.0" width="400.0" height="330.0" rx="12" fill="#ffffff" stroke="#d3d8e0" stroke-width="1.5"/>
<text x="240.0" y="106" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">layout.xml</text>
<line x1="54" y1="118" x2="426" y2="118" stroke="#5f8fd6" stroke-width="1.5"/>
<text x="240" y="118" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">describe la interfaz (etiquetas)</text>
<text x="60" y="150" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">&lt;Button</text>
<text x="60" y="174" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">  android:id="@+id/btn"</text>
<text x="60" y="198" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">  android:text="Enviar"</text>
<text x="60" y="222" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#8db6f2" text-anchor="start">  android:onClick="enviar"</text>
<text x="60" y="246" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">/&gt;</text>
<line x1="60" y1="285" x2="420" y2="285" stroke="#d3d8e0" stroke-width="1.5"/>
<text x="240" y="308" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">la lógica va aparte (Kotlin)</text>
<text x="60" y="336" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">findViewById&lt;Button&gt;(R.id.btn)</text>
<text x="60" y="360" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">  .setOnClickListener {</text>
<text x="60" y="384" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">    enviar()</text>
<text x="60" y="408" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">  }</text>
<line x1="450" y1="245" x2="550" y2="245" stroke="#2f6fdc" stroke-width="3" marker-end="url(#p2f6fdc)"/>
<text x="500" y="232" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#2f6fdc" text-anchor="middle">equivale a</text>
<rect x="560.0" y="80.0" width="400.0" height="330.0" rx="12" fill="#ffffff" stroke="#d3d8e0" stroke-width="1.5"/>
<text x="760.0" y="106" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Pantalla.kt</text>
<line x1="574" y1="118" x2="946" y2="118" stroke="#5aa585" stroke-width="1.5"/>
<text x="760" y="118" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">interfaz y lógica, todo en Kotlin</text>
<text x="580" y="150" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">@Composable</text>
<text x="580" y="174" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">fun Pantalla() {</text>
<text x="580" y="198" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#2e7d32" text-anchor="start">  Button(onClick = { enviar() }) {</text>
<text x="580" y="222" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">    Text("Enviar")</text>
<text x="580" y="246" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">  }</text>
<text x="580" y="270" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">}</text>
<text x="500" y="456" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#2f6fdc" text-anchor="middle">etiqueta = composable  ·  atributo = parámetro</text>
<text x="500" y="480" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#2f6fdc" text-anchor="middle">valor = argumento  ·  anidamiento = slots (dentro de las llaves)</text>
</svg>
