<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Flujo de un evento: detectar, interpretar, validar, mutar el estado y recomponer">
<defs><marker id="p2f6fdc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdc"/></marker><marker id="pe08a1e" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<rect x="1" y="1" width="998" height="468" rx="14" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/>
<text x="500" y="44" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Del toque del usuario a la pantalla nueva: el flujo de un evento</text>
<polygon points="25,110 190,110 213,180 190,250 25,250 48,180" fill="#8db6f2" stroke="#5f8fd6" stroke-width="2"/>
<text x="53" y="142" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="120" y="178" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Detectar</text>
<text x="120" y="204" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">Modifier de gesto</text>
<text x="120" y="222" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">clickable, pointerInput…</text>
<polygon points="216,110 381,110 404,180 381,250 216,250 239,180" fill="#9bc7e8" stroke="#7b8494" stroke-width="2"/>
<text x="244" y="142" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="311" y="178" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Interpretar</text>
<text x="311" y="204" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">lambda con los datos</text>
<text x="311" y="222" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">ya procesados</text>
<polygon points="407,110 572,110 595,180 572,250 407,250 430,180" fill="#8fd0b3" stroke="#5aa585" stroke-width="2"/>
<text x="435" y="142" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="502" y="178" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Validar</text>
<text x="502" y="204" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">convertir y rechazar</text>
<text x="502" y="222" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">lo imposible (require)</text>
<polygon points="598,110 763,110 786,180 763,250 598,250 621,180" fill="#d4dc8a" stroke="#7b8494" stroke-width="2"/>
<text x="626" y="142" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="693" y="178" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Mutar el estado</text>
<text x="693" y="204" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">MutableState, fuera</text>
<text x="693" y="222" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">del componente</text>
<polygon points="789,110 954,110 977,180 954,250 789,250 812,180" fill="#f6c07a" stroke="#d99a45" stroke-width="2"/>
<text x="817" y="142" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="884" y="178" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Recomponer</text>
<text x="884" y="204" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">Compose repinta</text>
<text x="884" y="222" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2937" text-anchor="middle">lo que ha cambiado</text>
<rect x="60.0" y="300.0" width="880.0" height="90.0" rx="12" fill="#fff8ee" stroke="#e08a1e" stroke-width="2"/>
<text x="500" y="336" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">La acción de un evento NO repinta: cambia el estado.</text>
<text x="500" y="366" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="600" fill="#e08a1e" text-anchor="middle">Quien repinta es el sistema de composición. Nunca al revés.</text>
<text x="500" y="436" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">Con eventos y estado separados, el componente solo recibe parámetros y se prueba sin pantalla.</text>
</svg>
