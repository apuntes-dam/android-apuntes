<text x="210" y="410" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6472" text-anchor="middle">A es el primer hijo (al fondo) y C el último.</text>
<text x="210" y="434" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6472" text-anchor="middle">Orden de dibujo A → B → C: se ve lo último.</text>
<text x="715" y="48" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">Colocar con Alignment</text>
<text x="715" y="76" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" font-weight="600" fill="#e08a1e" text-anchor="middle">contentAlignment (todos) o Modifier.align(…) (cada hijo)</text>
