<rect x="1" y="1" width="998" height="502" rx="14" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/>
<text x="500" y="40" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">Una función composable, por dentro</text>
<rect x="30.0" y="66.0" width="450.0" height="200.0" rx="12" fill="#f6f8fa" stroke="#c9d1d9" stroke-width="2"/>
