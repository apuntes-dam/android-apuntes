<text x="56" y="112" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">@Composable</text>
<text x="56" y="154" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#1f2937" text-anchor="start">fun</text>
<text x="99.2" y="154" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Saludo</text>
<text x="164.0" y="154" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#1f2937" text-anchor="start">(</text>
<text x="174.8" y="154" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">nombre: String</text>
<text x="326.0" y="154" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#1f2937" text-anchor="start">) {</text>
<text x="99.2" y="196" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="start">Text("Hola, $nombre")</text>
<text x="56" y="238" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="400" fill="#1f2937" text-anchor="start">}</text>
<rect x="510.0" y="90.0" width="22.0" height="22.0" rx="5" fill="#fde3bd" stroke="#9aa4b2" stroke-width="1.5"/>
<text x="544" y="107" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#2f6fdc" text-anchor="start">@Composable</text>
<text x="544" y="128" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">la marca: esta función dibuja interfaz</text>
<rect x="510.0" y="140.0" width="22.0" height="22.0" rx="5" fill="#cfe0fb" stroke="#9aa4b2" stroke-width="1.5"/>
<text x="544" y="157" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#2f6fdc" text-anchor="start">Saludo</text>
<text x="544" y="178" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">nombre con mayúscula, como una clase</text>
<rect x="510.0" y="190.0" width="22.0" height="22.0" rx="5" fill="#cdeedd" stroke="#9aa4b2" stroke-width="1.5"/>
<text x="544" y="207" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#2f6fdc" text-anchor="start">nombre: String</text>
<text x="544" y="228" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">datos de entrada, como en cualquier función</text>
<rect x="510.0" y="240.0" width="22.0" height="22.0" rx="5" fill="#e5d6f7" stroke="#9aa4b2" stroke-width="1.5"/>
<text x="544" y="257" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="16" font-weight="700" fill="#2f6fdc" text-anchor="start">Text("Hola, $nombre")</text>
<text x="544" y="278" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">dibuja el texto; no devuelve ningún valor</text>
<text x="500" y="316" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Se llama desde otro composable y forman un árbol</text>
