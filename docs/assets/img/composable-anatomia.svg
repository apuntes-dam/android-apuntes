<text x="908" y="388" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Hola, Ana</text>
<text x="500" y="474" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Un composable no devuelve un valor: cada llamada añade una pieza a la pantalla.</text>
