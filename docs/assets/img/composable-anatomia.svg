<text x="145.0" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">setContent { }</text>
<text x="145.0" y="404" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">arranca la interfaz</text>
<rect x="300.0" y="344.0" width="230.0" height="76.0" rx="12" fill="#8fd0b3" stroke="#5aa585" stroke-width="2.5"/>
<text x="415.0" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Saludo("Ana")</text>
<text x="415.0" y="404" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">tu composable</text>
<rect x="580.0" y="344.0" width="210.0" height="76.0" rx="12" fill="#f6c07a" stroke="#d99a45" stroke-width="2.5"/>
<text x="685.0" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Text("Hola, Ana")</text>
<text x="685.0" y="404" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="middle">dibuja el texto</text>
