<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="Pruebas en src/test (JVM) frente a src/androidTest (dispositivo)">
<defs><marker id="p2f6fdc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdc"/></marker><marker id="pe08a1e" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<rect x="1" y="1" width="998" height="508" rx="14" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/>
<text x="500" y="44" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">¿En qué carpeta va cada prueba?</text>
<rect x="30.0" y="80.0" width="460.0" height="400.0" rx="12" fill="#ffffff" stroke="#5aa585" stroke-width="1.5"/>
<rect x="30.0" y="80.0" width="460.0" height="70.0" rx="12" fill="#8fd0b3" stroke="#5aa585" stroke-width="1.5"/>
<text x="260" y="126" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">src/test</text>
<text x="260" y="190" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">se ejecuta en la JVM, sin Android</text>
<text x="260" y="232" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">Regla:</text>
<text x="260" y="258" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f6fdc" text-anchor="middle">si solo necesita PENSAR</text>
<text x="260" y="308" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle">Ejemplos</text>
<text x="55" y="340" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">•  deVelocidad("75") lanza IllegalArgumentException</text>
<text x="55" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">•  el Saver reconstruye una ConfigPuntero</text>
<text x="55" y="420" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">•  los validadores (funciones normales)</text>
<rect x="510.0" y="80.0" width="460.0" height="400.0" rx="12" fill="#ffffff" stroke="#d99a45" stroke-width="1.5"/>
<rect x="510.0" y="80.0" width="460.0" height="70.0" rx="12" fill="#f6c07a" stroke="#d99a45" stroke-width="1.5"/>
<text x="740" y="126" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="26" font-weight="700" fill="#1f2937" text-anchor="middle">src/androidTest</text>
<text x="740" y="190" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">se ejecuta en un móvil o emulador</text>
<text x="740" y="232" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">Regla:</text>
<text x="740" y="258" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f6fdc" text-anchor="middle">si necesita VER LA PANTALLA o tocar algo</text>
<text x="740" y="308" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="700" fill="#5b6472" text-anchor="middle">Ejemplos</text>
<text x="535" y="340" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">•  createComposeRule() monta el componente</text>
<text x="535" y="380" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">•  se busca por testTag o por texto</text>
<text x="535" y="420" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">•  se comprueba que se ve «Fallido»</text>
<line x1="500" y1="84" x2="500" y2="476" stroke="#e1e4e8" stroke-width="2"/>
</svg>
