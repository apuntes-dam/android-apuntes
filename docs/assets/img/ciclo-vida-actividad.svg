<line x1="380" y1="512" x2="380" y2="570" stroke="#2f6fdc" stroke-width="3" marker-end="url(#p2f6fdc)"/>
<path d="M275.0,396.0 C205,370 205,312 275.0,286.0" fill="none" stroke="#e08a1e" stroke-width="2.5" marker-end="url(#pe08a1e)"/>
<text x="212" y="334" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="end">vuelve</text>
<text x="212" y="352" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="end">el foco</text>
<rect x="20.0" y="300.0" width="110.0" height="44.0" rx="10" fill="#e3edf9" stroke="#7b8494" stroke-width="2"/>
<text x="75" y="328" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">onRestart</text>
<path d="M275.0,486.0 C40,486.0 40,420 75,346" fill="none" stroke="#e08a1e" stroke-width="2.5" marker-end="url(#pe08a1e)"/>
<path d="M75,300 C75,230 205,196 275.0,196.0" fill="none" stroke="#e08a1e" stroke-width="2.5" marker-end="url(#pe08a1e)"/>
<text x="30" y="540" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start">el usuario vuelve</text>
<text x="30" y="558" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#e08a1e" text-anchor="start">a una pantalla detenida</text>
<path d="M692,260 L700,260 L700,422 L692,422" fill="none" stroke="#5b6472" stroke-width="2.5"/>
<path d="M740,170 L748,170 L748,512 L740,512" fill="none" stroke="#5b6472" stroke-width="2.5"/>
<path d="M788,80 L796,80 L796,622 L788,622" fill="none" stroke="#5b6472" stroke-width="2.5"/>
<text x="715" y="264" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">primer plano</text>
<text x="715" y="282" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">(onResume → onPause)</text>
<text x="763" y="174" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">visible</text>
<text x="763" y="192" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">(onStart → onStop)</text>
<text x="811" y="84" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start">vida completa</text>
<text x="811" y="102" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#5b6472" text-anchor="start">(onCreate → onDestroy)</text>
</svg>
