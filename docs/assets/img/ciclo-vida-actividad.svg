<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-label="Estados de una Activity: onCreate, onStart, onResume, onPause, onStop, onRestart y onDestroy">
<defs><marker id="p2f6fdc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fdc"/></marker><marker id="pe08a1e" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker></defs>
<rect x="1" y="1" width="998" height="648" rx="14" fill="#fbfbfa" stroke="#d6d9de" stroke-width="2"/>
<text x="500" y="40" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">El ciclo de vida de una Activity</text>
<rect x="275.0" y="80.0" width="210.0" height="52.0" rx="10" fill="#8db6f2" stroke="#7b8494" stroke-width="2"/>
<text x="380" y="113" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">onCreate</text>
<text x="499.0" y="112" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">se crea la pantalla (inicializar la interfaz)</text>
<rect x="275.0" y="170.0" width="210.0" height="52.0" rx="10" fill="#9bc7e8" stroke="#7b8494" stroke-width="2"/>
<text x="380" y="203" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">onStart</text>
<text x="499.0" y="202" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">va a hacerse visible</text>
<rect x="275.0" y="260.0" width="210.0" height="52.0" rx="10" fill="#8fd0b3" stroke="#7b8494" stroke-width="2"/>
<text x="380" y="293" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">onResume</text>
<text x="499.0" y="292" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">en primer plano e interactiva</text>
<rect x="275.0" y="370.0" width="210.0" height="52.0" rx="10" fill="#f2d28b" stroke="#7b8494" stroke-width="2"/>
<text x="380" y="403" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">onPause</text>
<text x="499.0" y="402" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">pierde el foco (otra pantalla encima)</text>
<rect x="275.0" y="460.0" width="210.0" height="52.0" rx="10" fill="#f6c07a" stroke="#7b8494" stroke-width="2"/>
<text x="380" y="493" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">onStop</text>
<text x="499.0" y="492" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">deja de ser visible</text>
<rect x="275.0" y="570.0" width="210.0" height="52.0" rx="10" fill="#e8a0a0" stroke="#7b8494" stroke-width="2"/>
<text x="380" y="603" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">onDestroy</text>
<text x="499.0" y="602" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">se destruye (se cierra)</text>
