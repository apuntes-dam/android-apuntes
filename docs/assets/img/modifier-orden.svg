<text x="750" y="320" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6472" text-anchor="middle">El amarillo ocupa todo y el texto queda</text>
<text x="750" y="344" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6472" text-anchor="middle">separado del borde. El margen queda DENTRO del color.</text>
<line x1="500" y1="30" x2="500" y2="360" stroke="#e1e4e8" stroke-width="2"/>
<text x="500" y="392" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">El padding es un marco: lo que va antes queda fuera; lo que va después, dentro.</text>
<text x="500" y="418" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6472" text-anchor="middle">Los ajustes de un Modifier se aplican de izquierda a derecha.</text>
