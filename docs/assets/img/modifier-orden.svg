<text x="250" y="320" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6472" text-anchor="middle">El amarillo es más pequeño, con aire alrededor.</text>
<text x="250" y="344" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6472" text-anchor="middle">El margen queda FUERA del color.</text>
<text x="750" y="52" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#2f6fdc" text-anchor="middle">Modifier.background(Color.Yellow).padding(16.dp)</text>
